services:
  openwebui:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy  # Ensures PostgreSQL is fully ready before Open WebUI starts
      searxng:
        condition: service_started  # Ensures SearXNG starts before Open WebUI
    environment:
      - DATABASE_URL=postgresql://openwebui_user:securepassword@postgres:5432/openwebui_db
      - NODE_OPTIONS=--max-old-space-size=8192
      - SEARXNG_QUERY_URL=http://host.docker.internal:8888/search?q=  # ✅ Corrected to ensure Open WebUI connects properly
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      - GOOGLE_SEARCH_CX=c085eabc04ada4c46  # ✅ Google PSE Search Engine ID
      - GOOGLE_API_KEY=AIzaSyBVq3MYKJlTM6roAGyw0sqH1eHG2QKX4HM  # ✅ Google API Key
    volumes:
      - ./backend:/app/backend
    networks:
      - openwebui_network

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"  # ✅ Maps container's port 8080 to host port 8888
    environment:
      - BASE_URL=http://searxng:8080/
    networks:
      - openwebui_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=openwebui_user
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=openwebui_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - openwebui_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui_user"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  openwebui_network:
    driver: bridge
