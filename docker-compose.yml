services:
  searxng:
    container_name: open-webui-searxng-1
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng_network
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET_KEY=SuperSecretKey123
      - SEARXNG_ENABLE_HTTP_API=true
      - SEARXNG_PUBLIC_INSTANCE=false
      - SEARXNG_SERVER__LIMITER=false
    volumes:
      - /tmp/settings.yml:/etc/searxng/settings.yml:ro
      - /tmp/limiter.toml:/etc/searxng/limiter.toml:ro  # ✅ Mounted properly

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:latest
    restart: unless-stopped
    networks:
      - searxng_network
    environment:
      - SEARXNG_BASE_URL=http://open-webui-searxng-1:8080/
    ports:
      - "3000:3000"
    depends_on:
      - searxng

networks:
  searxng_network:
    driver: bridge
